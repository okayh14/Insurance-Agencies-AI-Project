services:

  case-service:
    build:
      context: .
      dockerfile: services/case_service/Dockerfile
    container_name: case-service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn services.case_service.main:app --host 0.0.0.0 --port 8000

  classifier-service:
